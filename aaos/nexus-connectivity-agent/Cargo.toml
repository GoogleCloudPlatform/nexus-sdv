[package]
name = "nexus-connectivity-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"

# TLS for the provisioning path. `ring` rather than `aws_lc_rs`: both are usable, but
# aws-lc-sys builds a large C/assembly tree that expects a full cross toolchain, and this
# binary is linked with a bare musl gcc rather than through `cross` the way
# base-services/registration/server is (build.x86_64.sh:5).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
# Key pair and certificate signing request. Same crate and major version the registration
# server uses to read the CSR back, so both sides agree on the encoding by construction.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
# Reads the common name out of the factory certificate — the same crate the server uses on
# its side of that certificate.
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"
# Binds a socket before it connects, to make a real self-connected socket in a test.
socket2 = "0.5"

[build-dependencies]
tonic-build = "0.12"
