[package]
name = "nexus-aaos-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats = "0.50.0"
bytes = "1"
futures = "0.3"
prost = "0.14.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
