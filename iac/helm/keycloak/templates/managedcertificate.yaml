{{- if eq .Values.pkiStrategy "remote" }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "keycloak.fullname" . | trim }}-cert
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "keycloak.labels" . | indent 4 }}
spec:
  domains:
    # The browser-facing name; the LoadBalancer on 8443 keeps its private-CA
    # certificate for mutual TLS with vehicles.
    - keycloak-ui.{{ .Values.baseDomain }}
{{- end }}
