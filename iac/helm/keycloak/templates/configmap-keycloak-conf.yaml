apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . | trim }}-conf
  labels:
{{ include "keycloak.labels" . | indent 4 }}
data:
  keycloak.conf: |
    # Use the nginx x509 cert lookup provider so Keycloak reads the client cert
    # from the ssl-client-cert HTTP header set by the nginx sidecar.
    # This must be a build-time option (cannot be set via KC_ env var at runtime).
    spi-x509cert-lookup-provider=nginx
