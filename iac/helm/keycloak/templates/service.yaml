apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.fullname" . | trim }}
  {{- if eq .Values.pkiStrategy "remote" }}
  annotations:
    # keycloak.<baseDomain> points HERE, at the LoadBalancer on 8443 — not at the
    # Ingress. Keycloak authenticates vehicles by their client certificate
    # (clientAuthenticatorType client-x509), and an L7 load balancer that
    # terminates TLS cannot forward one. Machine clients therefore need a direct
    # TLS connection to Keycloak. Browsers use keycloak-ui.<baseDomain> instead.
    external-dns.alpha.kubernetes.io/hostname: keycloak.{{ .Values.baseDomain }}
    external-dns.alpha.kubernetes.io/ttl: "300"
    # Links the BackendConfig to this Service. Without it GKE falls back to its
    # default health check (GET / on the serving port), which Keycloak answers with
    # a redirect — the Ingress backend then stays UNHEALTHY and serves 502.
    cloud.google.com/backend-config: '{"default": "{{ include "keycloak.fullname" . | trim }}-backendconfig"}'
  {{- end }}
  labels:
{{ include "keycloak.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    # 8443 is exposed for all PKI strategies. Keycloak enforces sslRequired=external
    # which blocks HTTP admin/token requests from non-localhost callers — HTTPS is
    # required regardless of whether TLS is terminated with a real cert or self-signed.
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
      name: https
    {{- if eq .Values.pkiStrategy "remote" }}
    # Management port 9000 is remote-only (used by create-jwk-secrets-remote health probe).
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: management
    {{- end }}
  selector:
{{ include "keycloak.selectorLabels" . | indent 4 }}
