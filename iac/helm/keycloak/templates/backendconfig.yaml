{{- if eq .Values.pkiStrategy "remote" }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "keycloak.fullname" . | trim }}-backendconfig
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "keycloak.labels" . | indent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health/ready
    port: 9000
{{- end }}
