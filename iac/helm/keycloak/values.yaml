keycloak:
  adminUser: admin
  logLevel: DEBUG
  pkiStrategy: "local"
  baseDomain: ""
  # Local PKI only: full KC_HOSTNAME URL pointing at the Keycloak LoadBalancer IP
  # (e.g. https://34.7.129.221:8443) so the browser-facing OIDC URLs are reachable.
  # Empty => fall back to the in-cluster service name "keycloak" (in-cluster use only).
  frontendUrl: ""
  tls:
    cert: ""
    key: ""

ingress:
  staticIpName: ""

database:
  enabled: true
  vendor: "postgres"
  host: "127.0.0.1"
  port: "5432"
  name: "keycloak"
  username: "keycloak"
  password: ""  # Will be set via helmfile or --set flag
  existingSecret: ""  # Leave empty to use password field directly
  existingSecretKey: "password"

service:
  type: LoadBalancer
  httpPort: 8080
  httpsPort: 8443
