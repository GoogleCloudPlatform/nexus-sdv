# NATS user credentials (will be overridden by helmfile)
natsUsers:
  basic:
    username: "nats-user"
    password: "placeholder"  # Set via helmfile
  authCallout:
    username: "auth-callout-service"
    password: "placeholder"  # Set via helmfile
  connector:
    username: "connector"
    password: "placeholder"  # Set via helmfile

container:
  # The leaf port's certificate, key and CA bundle, from the secret deploy-nats.yaml creates.
  # Lists are patched, not merged — the chart's JSON-patch hook.
  patch:
    - op: add
      path: /volumeMounts/-
      value:
        name: nats-leaf-tls
        mountPath: /etc/nats-certs/leafnodes
        readOnly: true
  env:
    GOMEMLIMIT: 800MiB
  merge:
    resources:
      requests:
        cpu: "500m"
        memory: 500Mi
      limits:
        cpu: "1000m"
        memory: 1Gi

service:
  enabled: true
  merge:
    # Annotations are set via helmfile inline values
    spec:
      type: LoadBalancer
      ports:
        - name: nats
          port: 4222
          targetPort: 4222
          protocol: TCP
        - name: monitor
          port: 8222
          targetPort: 8222
          protocol: TCP
        - name: leafnodes
          port: 7422
          targetPort: 7422
          protocol: TCP
  ports:
    nats:
      enabled: true
    monitor:
      enabled: true

config:
  # JetStream: the Cloud Service Registry's store (Increment 2.2). One file-backed
  # persistent volume; the buckets nexus-registry-grants and nexus-registry-offers live
  # here. Durability for the data path itself is a later increment (2.5).
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      dir: /data
      # The class is named, not left to the cluster's default: the default creates a disk
      # type (pd-balanced) the arm64 nodes Autopilot provides refuse to attach. dynamic-rwo
      # is GKE's own class that picks the type the node accepts; 4Gi is the smallest size
      # both disk families offer.
      pvc:
        enabled: true
        size: 4Gi
        storageClassName: dynamic-rwo
  merge:
    debug: true
    trace: true
    listen: 0.0.0.0:4222
    http: 8222
    # No cluster block: one replica, no failover. A cluster port with a route to itself
    # made JetStream run clustered and wait forever for a meta leader (review, 2026-09-28).
    leafnodes:
      listen: 0.0.0.0:7422
      tls:
        cert_file: /etc/nats-certs/leafnodes/tls.crt
        key_file: /etc/nats-certs/leafnodes/tls.key
        # Every leaf must present a certificate issued by the registration CA — a vehicle's
        # operational certificate. The auth-callout then receives the verified chain and
        # reads the VIN from it (Increment 2.2, spec R1). Partner leafs (certificates from
        # the server CA, sample-clients/generate-leaf-node-cert*.sh) are not admitted: they
        # carry no VIN and leaf enforcement refuses them — their own design is a 1.3 topic.
        ca_file: /etc/nats-certs/leafnodes/ca-bundle.crt
        verify: true
    # Authorization configuration is set via helmfile using config.merge.authorization.users
    # This section is intentionally left minimal here and populated by helmfile set directives

natsBox:
  container:
    merge:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
  podTemplate:
    merge:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                # The arch value is overridden per-deploy by nats.yaml.gotmpl
                # (.StateValues.arch). For arm64 the gotmpl appends a
                # compute-class: autopilot-arm selector (matchExpressions[1]);
                # amd64 uses Autopilot's default provisioning (no compute-class).
                - key: kubernetes.io/arch
                  operator: In
                  values:
                  - arm64

podTemplate:
  patch:
    - op: add
      path: /spec/volumes/-
      value:
        name: nats-leaf-tls
        secret:
          secretName: nats-leaf-tls
  merge:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # The arch value is overridden per-deploy by nats.yaml.gotmpl
              # (.StateValues.arch). For arm64 the gotmpl appends a
              # compute-class: autopilot-arm selector (matchExpressions[1]);
              # amd64 uses Autopilot's default provisioning (no compute-class).
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64

