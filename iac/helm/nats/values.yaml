# NATS user credentials (will be overridden by helmfile)
natsUsers:
  basic:
    username: "nats-user"
    password: "placeholder"  # Set via helmfile
  authCallout:
    username: "auth-callout-service"
    password: "placeholder"  # Set via helmfile
  connector:
    username: "connector"
    password: "placeholder"  # Set via helmfile

container:
  env:
    GOMEMLIMIT: 800MiB
  merge:
    resources:
      requests:
        cpu: "500m"
        memory: 500Mi
      limits:
        cpu: "1000m"
        memory: 1Gi

service:
  enabled: true
  merge:
    # Annotations are set via helmfile inline values
    spec:
      type: LoadBalancer
      ports:
        - name: nats
          port: 4222
          targetPort: 4222
          protocol: TCP
        - name: monitor
          port: 8222
          targetPort: 8222
          protocol: TCP
        - name: leafnodes
          port: 7422
          targetPort: 7422
          protocol: TCP
  ports:
    nats:
      enabled: true
    monitor:
      enabled: true
    cluster:
      enabled: true

config:
  merge:
    debug: true
    trace: true
    listen: 0.0.0.0:4222
    http: 8222
    cluster:
      name: nats-cluster
      listen: 0.0.0.0:4248
      routes:
        - nats://127.0.0.1:4248
    leafnodes:
      listen: 0.0.0.0:7422
    # Authorization configuration is set via helmfile using config.merge.authorization.users
    # This section is intentionally left minimal here and populated by helmfile set directives

natsBox:
  container:
    merge:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
  podTemplate:
    merge:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                # The arch value is overridden per-deploy by nats.yaml.gotmpl
                # (.StateValues.arch). For arm64 the gotmpl appends a
                # compute-class: autopilot-arm selector (matchExpressions[1]);
                # amd64 uses Autopilot's default provisioning (no compute-class).
                - key: kubernetes.io/arch
                  operator: In
                  values:
                  - arm64

podTemplate:
  merge:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # The arch value is overridden per-deploy by nats.yaml.gotmpl
              # (.StateValues.arch). For arm64 the gotmpl appends a
              # compute-class: autopilot-arm selector (matchExpressions[1]);
              # amd64 uses Autopilot's default provisioning (no compute-class).
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64

