# The credential the sampler mints its own token with, to call the Data API: the
# Factory Helper's factory-operator client secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-api-sampler.fullname" . }}-auth
  namespace: sample-services
  labels:
    {{- include "data-api-sampler.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak-client-secret: {{ .Values.keycloak.clientSecret | quote }}
