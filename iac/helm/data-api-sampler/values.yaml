replicaCount: 1

image:
  repository: ""
  pullPolicy: Always
  tag: "latest"

service:
  # Cluster-internal, plain HTTP, and a Keycloak token carrying the required
  # realm role on /data/**. Until #558 it was a LoadBalancer with permitAll on
  # /data/**. From a workstation the way in is a port forward, which is
  # encrypted from the workstation to the pod:
  #   kubectl port-forward -n sample-services svc/data-api-sampler 8080:8080
  type: ClusterIP
  httpPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

dataApi:
  url: ""

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3

# Keycloak realm that issues the tokens this service accepts, and the client it
# uses to mint its own token for the Data API.
keycloak:
  # The issuer is learned from Keycloak's discovery document, because it differs
  # between remote and local PKI; see DiscoveredIssuerValidator.
  discoveryUrl: "http://keycloak.base-services.svc.cluster.local:8080/realms/sdv-telemetry/.well-known/openid-configuration"
  jwkSetUri: ""
  tokenUri: ""
  clientId: "factory-operator"
  clientSecret: ""
  requiredRealmRole: "factory-operator"
