apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-registry
  labels: { app.kubernetes.io/name: nexus-registry }
spec:
  # One registry at a time: grants are computed behind one lock inside the process, and a
  # second replica — or an old and a new pod during a rolling update — would answer
  # announces beside it.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: nexus-registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexus-registry }
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # A move leaves registrations and grants intact (they live in the store), but the
        # registry answers no announce for a few seconds. Autopilot keeps the pod through
        # scale-down and node auto-upgrade for at least 7 days; not through node repair,
        # VM maintenance, OOM or a manual drain
        # (https://docs.cloud.google.com/kubernetes-engine/docs/how-to/extended-duration-pods).
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - {{ .Values.arch | default "arm64" }}
              {{- if eq (.Values.arch | default "arm64") "arm64" }}
              # arm64 on Autopilot must name a compute class.
              - key: cloud.google.com/compute-class
                operator: In
                values:
                - autopilot-arm
              {{- end }}
      containers:
        - name: nexus-registry
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports: [{ containerPort: 8080 }]
          env:
            - { name: NATS_URL,  value: {{ .Values.nats.url | quote }} }
            - { name: NATS_USER, value: {{ .Values.nats.user | quote }} }
            - { name: LEASE_SECONDS, value: {{ .Values.lease.seconds | quote }} }
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: nexus-registry, key: NATS_PASSWORD }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
