apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-helper
  labels: { app.kubernetes.io/name: factory-helper }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: factory-helper }
  template:
    metadata:
      labels: { app.kubernetes.io/name: factory-helper }
      annotations:
        # Roll pods whenever the TLS material changes — mounted secrets are not
        # part of the pod-template hash, so without this a cert rotation (or a
        # cert fix) never restarts crash-looped pods (same pattern as the NATS
        # release's checksum annotations).
        checksum/tls: {{ printf "%s%s%s" .Values.certificates.serverCert .Values.certificates.serverKey .Values.certificates.keycloakCa | sha256sum }}
    spec:
      # K8s injects docker-link-style vars per service (FACTORY_HELPER_PORT=tcp://...)
      # which collide with our FACTORY_HELPER_* config vars — disable them.
      enableServiceLinks: false
      serviceAccountName: factory-helper-ksa
      tolerations:
      - key: "cloud.google.com/compute-class"
        operator: "Equal"
        value: "Scale-Out"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - {{ .Values.arch | default "arm64" }}
              {{- if eq (.Values.arch | default "arm64") "arm64" }}
              # arm64 on Autopilot: request the container-optimized Arm compute
              # class. Autopilot requires arm64 to name a compute-class;
              # "autopilot-arm" is the general-purpose Arm class. Autopilot
              # auto-adds the arm64 node toleration.
              - key: cloud.google.com/compute-class
                operator: In
                values:
                - autopilot-arm
              {{- end }}
      containers:
        - name: factory-helper
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8443 }]
          env:
            - { name: FACTORY_HELPER_GCP_PROJECT_ID, value: {{ .Values.gcpProjectId | quote }} }
            - { name: FACTORY_HELPER_GCP_REGION, value: {{ .Values.gcpRegion | quote }} }
            - { name: FACTORY_HELPER_CA_POOL, value: {{ .Values.caPool | quote }} }
            - { name: FACTORY_HELPER_KEYCLOAK_ISSUER, value: {{ .Values.keycloakIssuer | quote }} }
            {{- if .Values.vinRegistryUrl }}
            - { name: FACTORY_HELPER_VIN_REGISTRY_URL, value: {{ .Values.vinRegistryUrl | quote }} }
            {{- end }}
            {{- if .Values.certValidityDays }}
            - { name: FACTORY_HELPER_CERT_VALIDITY_DAYS, value: {{ .Values.certValidityDays | quote }} }
            {{- end }}
            - { name: FACTORY_HELPER_TLS_CERT_PATH, value: "/app/certificates/server.crt.pem" }
            - { name: FACTORY_HELPER_TLS_KEY_PATH, value: "/app/certificates/server.key.pem" }
            {{- if .Values.certificates.keycloakCa }}
            - { name: FACTORY_HELPER_KEYCLOAK_CA_PATH, value: "/app/certificates/keycloak-ca.pem" }
            {{- end }}
          volumeMounts:
            - { name: tls, mountPath: /app/certificates, readOnly: true }
          livenessProbe: {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: factory-helper-tls
            items:
              - { key: server.crt.pem, path: server.crt.pem }
              - { key: server.key.pem, path: server.key.pem }
              {{- if .Values.certificates.keycloakCa }}
              - { key: keycloak-ca.pem, path: keycloak-ca.pem }
              {{- end }}
