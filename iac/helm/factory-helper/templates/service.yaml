apiVersion: v1
kind: Service
metadata:
  name: factory-helper
  labels: { app.kubernetes.io/name: factory-helper }
  annotations:
    external-dns.alpha.kubernetes.io/hostname: factory.{{ .Values.baseDomain }}
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: factory-helper }
  ports:
    - { name: https, port: {{ .Values.service.port }}, targetPort: 8443, protocol: TCP }
