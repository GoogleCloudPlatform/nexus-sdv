apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-api.fullname" . }}
  labels:
    {{- include "data-api.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: data-api-ksa
      tolerations:
      - key: "cloud.google.com/compute-class"
        operator: "Equal"
        value: "Scale-Out"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - {{ .Values.arch | default "arm64" }}
              {{- if eq (.Values.arch | default "arm64") "arm64" }}
              # arm64 on Autopilot: request the container-optimized Arm compute class.
              # Autopilot requires arm64 to name a compute-class; "autopilot-arm" is
              # the general-purpose Arm class (backed by C4A, available in us-east4;
              # Scale-Out/T2A is not). Autopilot auto-adds the arm64 node toleration.
              - key: cloud.google.com/compute-class
                operator: In
                values:
                - autopilot-arm
              {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
          env:
            - name: GCP_PROJECT
              value: {{ .Values.gcp.projectId | quote }}
            - name: BT_INSTANCE
              value: {{ .Values.gcp.bigtableInstance | quote }}
            - name: BT_TABLE
              value: {{ .Values.gcp.bigtableTable | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: GRPC_ADDR
              value: {{ .Values.env.grpcAddr | quote }}
