# What the Data API needs to authenticate callers: the realm's public signing
# keys, as the base64 JWK set that deploy-keycloak.yaml writes to
# KEYCLOAK_JWK_B64.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-api.fullname" . }}-auth
  labels:
    {{- include "data-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak-jwk-b64: {{ .Values.keycloak.jwkB64 | quote }}
