image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  # Cluster-internal on purpose. The Data API is the in-cluster path to the
  # telemetry: it speaks plaintext gRPC and authenticates nobody, so a
  # LoadBalancer served a year of any vehicle's telemetry to anyone who knew a
  # VIN — and a VIN is readable through a windscreen. Consumers reach it at
  # data-api.base-services.svc.cluster.local:8080.
  type: ClusterIP
  port: 8080
  loadBalancerSourceRanges: []

gcp:
  projectId: ""
  serviceAccount: ""
  bigtableInstance: "bigtable-production-storage"
  bigtableTable: "telemetry"

env:
  logLevel: "debug"
  grpcAddr: "0.0.0.0:8080"

# Resource requests/limits — explicit values prevent GKE Autopilot from
# assigning its defaults (500m CPU / 2Gi memory per pod).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi