{{- if and .Values.tls.cert .Values.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-web-client.fullname" . }}-tls
  labels:
    {{- include "data-web-client.labels" . | nindent 4 }}
type: Opaque
data:
  tls.crt: {{ .Values.tls.cert }}
  tls.key: {{ .Values.tls.key }}
{{- end }}
