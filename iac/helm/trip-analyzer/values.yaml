env:
  - name: DATA_API_URL
    value: "data-api.base-services.svc.cluster.local:8080"
  - name: NATS_PORT
    value: "4222"
  - name: DATA_POLL_INTERVAL
    value: "15"
  - name: ENV
    value: "GCP"

replicaCount: 1

image:
  repository: ""
  pullPolicy: Always
  tag: "latest"

service:
  type: LoadBalancer
  httpPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 2048Mi
  requests:
    cpu: 200m
    memory: 2048Mi

livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 8
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 25
  periodSeconds: 10
  timeoutSeconds: 8
