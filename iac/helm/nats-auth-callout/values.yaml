image:
  tag: "0.1.2"
  pullPolicy: Always

# Log level for the auth callout service
# Valid values: DEBUG, INFO, WARN, ERROR
# Default: INFO (overridden to DEBUG via helmfile)
logLevel: "DEBUG"

# Enforcement per connection kind (Increment 2.2, spec D6).
# leaf   - vehicles: a leaf node connection presents the operational certificate on the
#          hub's TLS leaf port, so its VIN is provable. "enforce" refuses a leaf without one.
# client - the 1.x sample clients on 4222 present a token only. "log" until release 1.3
#          brings them onto TLS with their certificate — then set "enforce" here. Until
#          then every such connection leaves a "would-deny" line in the callout log.
leafEnforcement: "enforce"
clientEnforcement: "log"

service:
  type: ClusterIP
  annotations: {}
  httpPort: 8080
