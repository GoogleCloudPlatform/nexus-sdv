apiVersion: apps/v1
kind: Deployment
metadata:
  name: pressure-monitor
  labels: { app.kubernetes.io/name: pressure-monitor }
spec:
  # One replica, recreated: the pod does not deregister when it stops, so a move or
  # restart leaves its channel as it was rather than closing and reopening it.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: pressure-monitor }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pressure-monitor }
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # The service does not deregister when it stops, so a move or restart leaves its
        # channel as it was. safe-to-evict stays false anyway, to avoid a needless restart
        # (finding F46). Autopilot then keeps the Pod through scale-down and node
        # auto-upgrade for at least 7 days; not through node repair, VM maintenance, OOM or
        # a manual drain
        # (https://docs.cloud.google.com/kubernetes-engine/docs/how-to/extended-duration-pods).
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - {{ .Values.arch | default "arm64" }}
              {{- if eq (.Values.arch | default "arm64") "arm64" }}
              - key: cloud.google.com/compute-class
                operator: In
                values:
                - autopilot-arm
              {{- end }}
      containers:
        - name: pressure-monitor
          image: "{{ .Values.image.repository }}/pressure-monitor:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: REGISTRY_URL, value: {{ .Values.registryUrl | quote }} }
            - { name: NATS_URL,     value: {{ .Values.nats.url | quote }} }
            - { name: NATS_USER,    value: {{ .Values.nats.user | quote }} }
            - { name: LOG_DETAIL,   value: {{ .Values.logDetail | quote }} }
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: reference-services, key: NATS_PASSWORD }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pressure-monitor
  labels: { app.kubernetes.io/name: pressure-monitor }
# ClusterIP: limits are sent from inside the cluster only (Plan B ruling 7).
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: pressure-monitor }
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
