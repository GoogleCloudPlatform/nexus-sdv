apiVersion: v1
kind: Service
metadata:
  name: vin-registry
  labels: { app.kubernetes.io/name: vin-registry }
# ClusterIP on purpose: only factory-helper and the registration server report
# to it, both from inside the cluster. Nothing here is exposed publicly, so the
# service carries no authentication of its own.
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: vin-registry }
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: 8080, protocol: TCP }
