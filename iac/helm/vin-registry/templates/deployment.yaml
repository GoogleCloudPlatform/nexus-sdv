apiVersion: apps/v1
kind: Deployment
metadata:
  name: vin-registry
  labels: { app.kubernetes.io/name: vin-registry }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: vin-registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vin-registry }
    spec:
      serviceAccountName: vin-registry-ksa
      tolerations:
      - key: "cloud.google.com/compute-class"
        operator: "Equal"
        value: "Scale-Out"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - {{ .Values.arch | default "arm64" }}
              {{- if eq (.Values.arch | default "arm64") "arm64" }}
              # arm64 on Autopilot: request the container-optimized Arm compute
              # class. Autopilot requires arm64 to name a compute-class.
              - key: cloud.google.com/compute-class
                operator: In
                values:
                - autopilot-arm
              {{- end }}
      containers:
        - name: vin-registry
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          env:
            # The Cloud SQL proxy sidecar listens on localhost.
            - { name: DB_HOST,     value: "localhost" }
            - { name: DB_PORT,     value: "5432" }
            - { name: DB_NAME,     value: {{ .Values.database.name | quote }} }
            - { name: DB_USER,     value: {{ .Values.database.user | quote }} }
            - { name: DB_PASSWORD, value: {{ .Values.database.password | quote }} }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
        - name: cloud-sql-proxy
          image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.0"
          args:
            - "--structured-logs"
            - "--health-check"
            - "--port=5432"
            - "{{ .Values.database.instanceConnectionName }}"
          securityContext:
            runAsNonRoot: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
