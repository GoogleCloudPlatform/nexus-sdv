{{- if .Values.externalSecretsEnabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nats-bigtable-connector-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: nats-bigtable-connector
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName | default "gcpsm-secret-store" }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "SecretStore" }}
  target:
    name: nats-bigtable-connector-secret
    template:
      engineVersion: v2
      data:
        NATS_USER: "{{ .Values.nats.user | default "connector" }}"
        NATS_PASSWORD: "{{ "{{ .natsPassword }}" }}"
        NATS_HOST: "{{ .Values.nats.host | default "nats.base-services.svc.cluster.local:4222" }}"
  data:
    - secretKey: natsPassword
      remoteRef:
        key: {{ .Values.externalSecrets.secretName | default "NATS_CONNECTOR_PASSWORD" }}
{{- end }}
