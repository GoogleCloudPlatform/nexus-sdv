# This Secret is created by external-secrets operator, which syncs credentials
# from GCP Secret Manager to avoid exposing them in the deployment pipeline.
#
# If external-secrets is not available, you can create this manually:
#   kubectl create secret generic nats-bigtable-connector-secret \
#     --from-literal=NATS_USER=connector \
#     --from-literal=NATS_PASSWORD=<password-from-gcp-secret-manager> \
#     --from-literal=NATS_HOST=nats.base-services.svc.cluster.local:4222 \
#     -n {{ .Release.Namespace }}
#
# The deployment.yaml references this secret; it must exist before the pod starts.
{{ if .Values.externalSecretsEnabled }}
# Secret created by external-secrets operator — no need to render here
{{ else }}
apiVersion: v1
kind: Secret
metadata:
  name: nats-bigtable-connector-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  NATS_USER: {{ .Values.nats.user | default "connector" | quote }}
  NATS_PASSWORD: {{ .Values.nats.password | quote }}
  NATS_HOST: {{ .Values.nats.host | default "nats.base-services.svc.cluster.local:4222" | quote }}
{{ end }}
