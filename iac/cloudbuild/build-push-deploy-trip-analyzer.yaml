steps:
  # ============================================================================
  # 1. SETUP & AUTHENTICATION (kubeconfig for kubectl and Helmfile)
  # ============================================================================
  - id: 'get-gke-credentials'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials "$$GKE_CLUSTER_NAME" \
          --region="$$GCP_REGION" \
          --project="$PROJECT_ID"
        
        echo "Injecting Cloud Build Access Token into Kubeconfig..."
        TOKEN=$$(gcloud auth print-access-token)

        kubectl config set-credentials build-user --token="$${TOKEN}"

        CONTEXT=$$(kubectl config current-context)
        kubectl config set-context "$${CONTEXT}" --user=build-user

        echo "Kubeconfig successfully patched for standalone usage."
    secretEnv: [ 'GKE_CLUSTER_NAME', 'GCP_REGION' ]

  # ============================================================================
  # 2. BUILD & PUSH DOCKER IMAGE
  # ============================================================================
  - id: 'configure-ar'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TOKEN=$$(gcloud auth print-access-token)
        AUTH=$$(printf '%s' "oauth2accesstoken:$$TOKEN" | base64 -w0)
        # Derive the registry host from IMAGE_REPO so this works in any region
        # (previously hardcoded europe-west4, which broke pushes to other regions).
        REGISTRY_HOST="$${IMAGE_REPO%%/*}"
        mkdir -p /root/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$$REGISTRY_HOST" "$$AUTH" \
          > /root/.docker/config.json
        echo "Artifact Registry auth configured for $${REGISTRY_HOST} (token-based)."
    secretEnv: [ 'IMAGE_REPO' ]
    waitFor: ['-']

  - id: 'build-push-trip-analyzer'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd sample-services/trip_analyzer
        
        pwd
        
        echo "Initializing Docker Buildx for ${_ARCH}..."
        docker buildx create --name builder --use

        echo "Building Trip Analyzer image for linux/${_ARCH} and pushing..."
        docker buildx build \
          --platform linux/${_ARCH} \
          --build-arg DOCKER_HUB_MIRROR="$${IMAGE_REPO%/artifact-registry}/docker-hub" \
          --tag "$${IMAGE_REPO}/trip-analyzer:latest" \
          --push \
          .
    secretEnv: [ 'IMAGE_REPO' ]
    waitFor: ['configure-ar']

  # ============================================================================
  # 4. DEPLOY Trip Analyzer (Helmfile)
  # ============================================================================
# ============================================================================
# COLLECT THIS SERVICE'S CREDENTIAL
#
# The Data API requires a token since #558, so the trip analyzer mints its own
# with the factory-operator client secret. The Data API is cluster-internal and
# speaks plaintext gRPC, so no trust anchor is needed.
# ============================================================================
  - id: 'collect-client-secret'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # The helmfile container has no gcloud, so leave it here.
        gcloud secrets versions access latest --secret="FACTORY_OPERATOR_CLIENT_SECRET" --project="$PROJECT_ID" | tr -d '\n' > factory_operator_client_secret.txt
        echo "✓ Client secret collected"
    waitFor: ['-']

  - id: 'deploy-trip-analyzer'
    name: 'ghcr.io/helmfile/helmfile:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export GCP_PROJECT_ID="$PROJECT_ID"
        export GCP_REGION="$$GCP_REGION"
        export IMAGE_REPO="$$IMAGE_REPO"

        # Written by collect-client-secret; this container has no gcloud.
        export FACTORY_OPERATOR_CLIENT_SECRET="$(cat factory_operator_client_secret.txt)"
        
        cd iac/helm/helmfile.d
        
        echo "Running Helmfile ${_HELM_ACTION}..."
        
        if ! helmfile --file trip-analyzer.yaml.gotmpl ${_HELM_ACTION} \
             --state-values-set arch=${_ARCH}; then
            echo "❌ Deployment Failed! Fetching Pod Logs for Debugging..."
            if ! command -v kubectl &> /dev/null; then
                curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl
                mv kubectl /usr/local/bin/
            fi
            echo "--- POD STATUS ---"
            kubectl get pods -n sample-services -l app.kubernetes.io/name=trip-analyzer
            echo "--- LOGS ---"
            kubectl logs -n sample-services -l app.kubernetes.io/name=trip-analyzer --tail=50
            exit 1
        fi

    secretEnv: [ 'GCP_REGION', 'IMAGE_REPO', 'NATS_CONNECTOR_PASSWORD', 'NATS_HOSTNAME']
    waitFor: [ 'build-push-trip-analyzer', 'collect-client-secret']

# ============================================================================
# SUBSTITUTIONS & SECRETS CONFIG
# ============================================================================
substitutions:
  _HELM_ACTION: "sync"
  _ARCH: "arm64"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GCP_REGION/versions/latest
      env: 'GCP_REGION'
    - versionName: projects/$PROJECT_ID/secrets/GKE_CLUSTER_NAME/versions/latest
      env: 'GKE_CLUSTER_NAME'
    - versionName: projects/$PROJECT_ID/secrets/IMAGE_REPO/versions/latest
      env: 'IMAGE_REPO'
    - versionName: projects/$PROJECT_ID/secrets/NATS_CONNECTOR_PASSWORD/versions/latest
      env: 'NATS_CONNECTOR_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/NATS_HOSTNAME/versions/latest
      env: 'NATS_HOSTNAME'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
