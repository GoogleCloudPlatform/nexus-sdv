steps:
  # ============================================================================
  # 0. SETUP & AUTHENTICATION
  # ============================================================================
  - id: 'configure-ar'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TOKEN=$$(gcloud auth print-access-token)
        AUTH=$$(printf '%s' "oauth2accesstoken:$$TOKEN" | base64 -w0)
        mkdir -p /root/.docker
        echo '{"auths":{"europe-west4-docker.pkg.dev":{"auth":"'$$AUTH'"}}}' \
          > /root/.docker/config.json
        echo "Artifact Registry auth configured (token-based, no credential helper)."
    waitFor: ['-']

  - id: 'build-push-nats-auth-callout'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd base-services/auth-callout
        
        VERSION=$$(cat VERSION)
        echo "Building NATS Auth-Callout Version: $$VERSION for ${_ARCH}"

        echo "Initializing Docker Buildx..."
        docker buildx create --name builder --use

        echo "Starting Docker Build for linux/${_ARCH}..."
        docker buildx build \
          --platform linux/${_ARCH} \
          --build-arg DOCKER_HUB_MIRROR="$${IMAGE_REPO%/artifact-registry}/docker-hub" \
          --tag "$${IMAGE_REPO}/nats-auth-callout:$${VERSION}" \
          --push \
          .
    secretEnv: ['IMAGE_REPO', 'GCP_REGION']
    waitFor: ['configure-ar']

# ============================================================================
# SUBSTITUTIONS & SECRETS CONFIG
# ============================================================================
substitutions:
  _GCP_REGION: "europe-west4"
  _ARCH: "arm64"
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GCP_REGION/versions/latest
      env: 'GCP_REGION'
    - versionName: projects/$PROJECT_ID/secrets/IMAGE_REPO/versions/latest
      env: 'IMAGE_REPO'

timeout: '3600s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
