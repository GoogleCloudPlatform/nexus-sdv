steps:
  # ============================================================================
  # 1. SETUP & AUTHENTICATION (kubeconfig for the later deployment)
  # ============================================================================
  - id: 'get-gke-credentials'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials "$$GKE_CLUSTER_NAME" \
          --region="$$GCP_REGION" \
          --project="$PROJECT_ID"
        
        echo "Injecting Cloud Build Access Token into Kubeconfig..."
        TOKEN=$$(gcloud auth print-access-token)

        kubectl config set-credentials build-user --token="$${TOKEN}"

        CONTEXT=$$(kubectl config current-context)
        kubectl config set-context "$${CONTEXT}" --user=build-user

        echo "Kubeconfig successfully patched for standalone usage."
    secretEnv: ['GKE_CLUSTER_NAME', 'GCP_REGION']

  # ============================================================================
  # 2. COMPILE PROTO FILES (Go & Protoc Environment)
  # ============================================================================
  - id: 'compile-proto'
    name: 'golang:1.24'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing Protoc..."
        apt-get update && apt-get install -y protobuf-compiler
        
        echo "Installing protoc-gen-go and protoc-gen-go-grpc..."
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        # v1.5.1 is the last release compatible with Go 1.24 (v1.6+ requires Go 1.25)
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

        GOPATH=$$(go env GOPATH)
        export PATH="$$PATH:$${GOPATH}/bin"

        echo "Compiling proto files..."
        cd base-services/data-api
        PATH="$$PATH:$${GOPATH}/bin" make proto

  # ============================================================================
  # 3. DOCKER HUB AUTHENTICATION
  # ============================================================================
  - id: 'configure-ar'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TOKEN=$$(gcloud auth print-access-token)
        AUTH=$$(printf '%s' "oauth2accesstoken:$$TOKEN" | base64 -w0)
        mkdir -p /root/.docker
        echo '{"auths":{"europe-west4-docker.pkg.dev":{"auth":"'$$AUTH'"}}}' \
          > /root/.docker/config.json
        echo "Artifact Registry auth configured (token-based, no credential helper)."
    waitFor: ['-']

  # ============================================================================
  # 4. BUILD & PUSH DOCKER IMAGE
  # ============================================================================
  - id: 'build-push-data-api'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd base-services/data-api
        
        echo "Initializing Docker Buildx..."
        docker buildx create --name builder --use

        echo "Starting Docker Build for linux/${_ARCH}..."
        docker buildx build \
          --platform linux/${_ARCH} \
          --build-arg DOCKER_HUB_MIRROR="$${IMAGE_REPO%/artifact-registry}/docker-hub" \
          --tag "$${IMAGE_REPO}/data-api:latest" \
          --push \
          .
    secretEnv: ['IMAGE_REPO']
    waitFor: ['configure-ar', 'compile-proto']

  # ============================================================================
  # 4. DEPLOY DATA API (Helmfile)
  # ============================================================================
# ============================================================================
# COLLECT WHAT THE DEPLOY NEEDS FROM SECRET MANAGER
#
# The Data API checks a Keycloak token on every call, so it needs the realm's
# public keys (KEYCLOAK_JWK_B64, written by deploy-keycloak.yaml). It learns the
# issuer from Keycloak itself at run time. It is cluster-internal and speaks
# plaintext gRPC, so there is no certificate to issue.
# ============================================================================
  - id: 'collect-auth-config'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # The helmfile container has no gcloud, so leave what it needs in the
        # workspace (same approach as build-push-deploy-factory-helper.yaml).
        gcloud secrets versions access latest --secret="KEYCLOAK_JWK_B64" --project="$PROJECT_ID" | tr -d '\n' > keycloak_jwk_b64.txt
        echo "✓ Realm keys collected"
    waitFor: ['-']

  - id: 'deploy-data-api'
    name: 'ghcr.io/helmfile/helmfile:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Read what collect-auth-config left in the workspace root before
        # changing directory; this container has no gcloud of its own.
        export KEYCLOAK_JWK_B64="$(cat keycloak_jwk_b64.txt)"

        cd iac/helm/helmfile.d

        echo "Exporting environment variables for Helmfile..."
        export GCP_PROJECT_ID="$PROJECT_ID"
        export GCP_REGION="$$GCP_REGION"
        export IMAGE_REPO="$$IMAGE_REPO"
        export DATA_API_BIGTABLE_CONNECTOR_GCP_SERVICE_ACCOUNT="$$DATA_API_BIGTABLE_CONNECTOR_GCP_SERVICE_ACCOUNT"

        echo "Running Helmfile ${_HELM_ACTION}..."

        if ! helmfile --file data-api.yaml.gotmpl ${_HELM_ACTION} \
             --state-values-set arch=${_ARCH}; then
            echo "❌ Deployment Failed! Fetching Pod Logs for Debugging..."
            if ! command -v kubectl &> /dev/null; then
                curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl
                mv kubectl /usr/local/bin/
            fi
            echo "--- POD STATUS ---"
            kubectl get pods -n base-services -l app.kubernetes.io/name=data-api
            echo "--- LOGS ---"
            kubectl logs -n base-services -l app.kubernetes.io/name=data-api --tail=50
            exit 1
        fi

    secretEnv: ['GCP_REGION', 'IMAGE_REPO', 'DATA_API_BIGTABLE_CONNECTOR_GCP_SERVICE_ACCOUNT']
    waitFor: ['build-push-data-api', 'get-gke-credentials', 'collect-auth-config']

# ============================================================================
# SUBSTITUTIONS & SECRETS CONFIG
# ============================================================================
substitutions:
  _HELM_ACTION: "sync"
  _ARCH: "arm64"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GCP_REGION/versions/latest
      env: 'GCP_REGION'
    - versionName: projects/$PROJECT_ID/secrets/GKE_CLUSTER_NAME/versions/latest
      env: 'GKE_CLUSTER_NAME'
    - versionName: projects/$PROJECT_ID/secrets/IMAGE_REPO/versions/latest
      env: 'IMAGE_REPO'
    - versionName: projects/$PROJECT_ID/secrets/DATA_API_BIGTABLE_CONNECTOR_GCP_SERVICE_ACCOUNT/versions/latest
      env: 'DATA_API_BIGTABLE_CONNECTOR_GCP_SERVICE_ACCOUNT'

timeout: '3600s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
