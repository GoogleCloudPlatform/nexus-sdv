# =============================================================================
# deploy-all.yaml — Parent orchestration build
#
# Calls each individual Cloud Build YAML in dependency order.
# Each child build can still be run independently by calling it directly.
#
# Dependency graph:
#
#   deploy-external-secrets ────────────────┐
#                                           ├─ deploy-external-dns (remote only) ─┐
#                                           │                                     ├─ deploy-keycloak ──┐
#                                           │                                     │    └─ build-push-nats-auth-callout
#                                           │                                     │         └─ deploy-nats-auth-callout ──┐
#                                           │                                     ├─ deploy-nats ──────────────────────────┼─ build-push-deploy-registration
#                                           │                                     │    └─ deploy-nats-bigtable-connector
#                                           │                                     └─ build-push-deploy-data-api
#                                           │                                          └─ build-push-deploy-data-api-sampler
#                                           └─ (all services depend on external-secrets for secret syncing)
# =============================================================================

steps:
  # ===========================================================================
  # WAVE 0a — External Secrets Operator (blocks all other deployments)
  # ===========================================================================
  - id: 'deploy-external-secrets'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['-']
    args:
      - '-c'
      - |
        echo "Deploying external-secrets operator..."
        gcloud builds submit . \
          --config=iac/cloudbuild/deploy-external-secrets.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}

  # ===========================================================================
  # WAVE 0 — External DNS (remote PKI only, blocks all other deployments)
  # ===========================================================================
  - id: 'deploy-external-dns'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-external-secrets']
    args:
      - '-c'
      - |
        if [ "${_PKI_STRATEGY}" != "remote" ]; then
          echo "Skipping external-dns (PKI strategy is '${_PKI_STRATEGY}', not 'remote')"
          exit 0
        fi
        echo "Deploying external-dns..."
        gcloud builds submit . \
          --config=iac/cloudbuild/deploy-external-dns.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_PKI_STRATEGY=${_PKI_STRATEGY}::_BASE_DOMAIN=${_BASE_DOMAIN}::_HELM_ACTION=${_HELM_ACTION}

  # ===========================================================================
  # WAVE 1 — Keycloak, NATS, Data API (parallel, all wait for external-dns)
  # ===========================================================================
  - id: 'deploy-keycloak'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-external-secrets', 'deploy-external-dns']
    args:
      - '-c'
      - |
        echo "Deploying Keycloak..."
        gcloud builds submit . \
          --config=iac/cloudbuild/deploy-keycloak.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_PKI_STRATEGY=${_PKI_STRATEGY}::_BASE_DOMAIN=${_BASE_DOMAIN}::_HELM_ACTION=${_HELM_ACTION}

  - id: 'build-push-nats-auth-callout'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-keycloak']
    args:
      - '-c'
      - |
        echo "Building and pushing NATS Auth Callout..."
        gcloud builds submit . \
          --config=iac/cloudbuild/build-push-nats-auth-callout.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}

  - id: 'deploy-nats-auth-callout'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['build-push-nats-auth-callout']
    args:
      - '-c'
      - |
        echo "Deploying NATS Auth Callout..."
        gcloud builds submit . \
          --config=iac/cloudbuild/deploy-nats-auth-callout.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}

  - id: 'deploy-nats'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-external-secrets', 'deploy-external-dns']
    args:
      - '-c'
      - |
        echo "Deploying NATS..."
        gcloud builds submit . \
          --config=iac/cloudbuild/deploy-nats.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_PKI_STRATEGY=${_PKI_STRATEGY}::_BASE_DOMAIN=${_BASE_DOMAIN}::_HELM_ACTION=${_HELM_ACTION}

  - id: 'build-push-deploy-data-api'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-external-secrets', 'deploy-external-dns']
    args:
      - '-c'
      - |
        echo "Building and deploying Data API..."
        gcloud builds submit . \
          --config=iac/cloudbuild/build-push-deploy-data-api.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}

  # ===========================================================================
  # WAVE 2 — Registration (needs Keycloak + NATS IPs)
  #          NATS Bigtable Connector (needs NATS)
  #          Data API Sampler (needs Data API)
  # ===========================================================================
  - id: 'build-push-deploy-registration'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-nats-auth-callout', 'deploy-nats']
    args:
      - '-c'
      - |
        # Resolve commit SHA: use Cloud Build's $COMMIT_SHA if available,
        # otherwise fall back to the substitution variable
        SHA="${_COMMIT_SHA}"
        if [ -z "$$SHA" ] || [ "$$SHA" = "manual" ]; then
          SHA="${COMMIT_SHA:-manual-latest}"
        fi
        echo "Building and deploying Registration Server (SHA: $$SHA)..."
        gcloud builds submit . \
          --config=iac/cloudbuild/build-push-deploy-registration.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_PKI_STRATEGY=${_PKI_STRATEGY}::_BASE_DOMAIN=${_BASE_DOMAIN}::_HELM_ACTION=${_HELM_ACTION}::_COMMIT_SHA=$$SHA

  - id: 'build-push-deploy-factory-helper'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-keycloak']
    args:
      - '-c'
      - |
        # factory-helper v1 issues its TLS cert via GCP CAS and refuses to run
        # with local PKI, so skip it there instead of failing the deployment.
        if [ "${_PKI_STRATEGY}" != "remote" ]; then
          echo "Skipping factory-helper (PKI strategy is '${_PKI_STRATEGY}', not 'remote')"
          exit 0
        fi
        SHA="${_COMMIT_SHA}"
        if [ -z "$$SHA" ] || [ "$$SHA" = "manual" ]; then
          SHA="${COMMIT_SHA:-manual-latest}"
        fi
        echo "Building and deploying Factory Helper (SHA: $$SHA)..."
        gcloud builds submit . \
          --config=iac/cloudbuild/build-push-deploy-factory-helper.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}::_COMMIT_SHA=$$SHA

  - id: 'deploy-nats-bigtable-connector'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['deploy-nats']
    args:
      - '-c'
      - |
        echo "Deploying NATS Bigtable Connector..."
        gcloud builds submit . \
          --config=iac/cloudbuild/deploy-nats-bigtable-connector.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}

  - id: 'build-push-deploy-data-api-sampler'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['build-push-deploy-data-api']
    args:
      - '-c'
      - |
        echo "Building and deploying Data API Sampler..."
        gcloud builds submit . \
          --config=iac/cloudbuild/build-push-deploy-data-api-sampler.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}

  - id: 'build-push-deploy-web-client'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['build-push-deploy-data-api']
    args:
      - '-c'
      - |
        echo "Building and deploying Data API Sampler..."
        gcloud builds submit . \
          --config=iac/cloudbuild/build-push-deploy-data-web-client.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}        

  # vin-registry waits for the web client because that pipeline creates the
  # vehicle_groups table it enrols VINs into. Reporting is best effort either
  # way, but ordering them avoids losing the first few reports of a fresh
  # platform to a table that does not exist yet.
  - id: 'build-push-deploy-vin-registry'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    waitFor: ['build-push-deploy-web-client']
    args:
      - '-c'
      - |
        echo "Building and deploying VIN Registry..."
        gcloud builds submit . \
          --config=iac/cloudbuild/build-push-deploy-vin-registry.yaml \
          --project=$PROJECT_ID \
          --region=${_REGION} \
          --substitutions=^::^_ARCH=${_ARCH}::_HELM_ACTION=${_HELM_ACTION}
        
        

# =============================================================================
# SUBSTITUTIONS & OPTIONS
# =============================================================================
substitutions:
  _ARCH: "arm64"
  _PKI_STRATEGY: "local"
  _BASE_DOMAIN: ""
  _REGION: "europe-west1"
  _HELM_ACTION: "sync"
  _COMMIT_SHA: "manual"

timeout: '7200s'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
