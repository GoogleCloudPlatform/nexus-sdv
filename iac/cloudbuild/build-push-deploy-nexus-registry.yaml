steps:
  - id: 'get-gke-credentials'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials "$$GKE_CLUSTER_NAME" \
          --region="$$GCP_REGION" \
          --project="$PROJECT_ID"
        TOKEN=$$(gcloud auth print-access-token)
        kubectl config set-credentials build-user --token="$${TOKEN}"
        CONTEXT=$$(kubectl config current-context)
        kubectl config set-context "$${CONTEXT}" --user=build-user
    secretEnv: ['GKE_CLUSTER_NAME', 'GCP_REGION']

  - id: 'configure-ar'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # The registry host is the first part of IMAGE_REPO, so this works in any region;
        # the vin-registry pipeline names europe-west4 literally.
        HOST="$${IMAGE_REPO%%/*}"
        TOKEN=$$(gcloud auth print-access-token)
        AUTH=$$(printf '%s' "oauth2accesstoken:$$TOKEN" | base64 -w0)
        mkdir -p /root/.docker
        echo '{"auths":{"'"$$HOST"'":{"auth":"'"$$AUTH"'"}}}' > /root/.docker/config.json
        echo "Artifact Registry auth configured for $$HOST."
    secretEnv: ['IMAGE_REPO']
    waitFor: ['-']

  - id: 'build-push-nexus-registry'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --name builder --use
        SHA="${_COMMIT_SHA}"
        if [ -z "$$SHA" ] || [ "$$SHA" == "manual" ]; then
           if [ -n "$COMMIT_SHA" ]; then SHA="$COMMIT_SHA"; else SHA="manual-latest"; fi
        fi
        echo "$$SHA" > commit_sha.txt
        IMAGE_URI="$${IMAGE_REPO}/nexus-registry"
        docker buildx build \
          --platform linux/${_ARCH} \
          --build-arg DOCKER_HUB_MIRROR="$${IMAGE_REPO%/artifact-registry}/docker-hub" \
          --file ./base-services/nexus-registry/Dockerfile \
          --tag "$${IMAGE_URI}:$${SHA}" \
          --tag "$${IMAGE_URI}:latest" \
          --push \
          .
    secretEnv: [ 'IMAGE_REPO' ]
    waitFor: ['configure-ar']

  - id: 'deploy-nexus-registry'
    name: 'ghcr.io/helmfile/helmfile:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export COMMIT_SHA=$$(cat commit_sha.txt)
        cd iac/helm/helmfile.d
        if ! helmfile --file nexus-registry.yaml.gotmpl ${_HELM_ACTION} --wait \
            --args "--timeout 4m0s" \
            --state-values-set arch=${_ARCH} \
            --state-values-set image.tag="$${COMMIT_SHA}"; then
            echo "Deployment failed; pod status and logs follow."
            if ! command -v kubectl &> /dev/null; then
                curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl && mv kubectl /usr/local/bin/
            fi
            kubectl get pods -n base-services -l app.kubernetes.io/name=nexus-registry
            kubectl logs -n base-services -l app.kubernetes.io/name=nexus-registry --tail=50
            exit 1
        fi
    secretEnv: [ 'IMAGE_REPO', 'NATS_REGISTRY_PASSWORD' ]
    waitFor: [ 'build-push-nexus-registry', 'get-gke-credentials' ]

substitutions:
  _ARCH: "amd64"
  _COMMIT_SHA: "manual"
  _HELM_ACTION: "sync"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GCP_REGION/versions/latest
      env: 'GCP_REGION'
    - versionName: projects/$PROJECT_ID/secrets/GKE_CLUSTER_NAME/versions/latest
      env: 'GKE_CLUSTER_NAME'
    - versionName: projects/$PROJECT_ID/secrets/IMAGE_REPO/versions/latest
      env: 'IMAGE_REPO'
    - versionName: projects/$PROJECT_ID/secrets/NATS_REGISTRY_PASSWORD/versions/latest
      env: 'NATS_REGISTRY_PASSWORD'

timeout: '2400s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
