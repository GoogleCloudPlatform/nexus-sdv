# =============================================================================
# test-environments.yaml — Sequential bootstrap → teardown cycle
#
# For every .bootstrap_env file found in a GCS directory, runs:
#   1. bootstrap-platform.yaml   (spin up the environment)
#   2. teardown-platform.yaml    (tear it down)
#
# Execution is strictly sequential — one environment at a time. A failed
# bootstrap is recorded, its environment is torn down anyway, and the loop
# continues; the build fails at the end if any environment failed. A failed
# teardown stops the loop at once, because the next environment would collide
# with its leftovers in the shared project.
#
# Intended use: CI integration test across multiple environment configurations,
# verifying that bootstrap and teardown work end-to-end for each.
#
# Run manually:
#   gcloud builds submit . \
#     --config=iac/cloudbuild/test-environments.yaml \
#     --project=<PROJECT_ID> \
#     --region=<REGION> \
#     --substitutions=_BOOTSTRAP_ENVS_DIR=gs://<PROJECT_ID>-bootstrap-envs/
#
# Required substitutions:
#   _BOOTSTRAP_ENVS_DIR  GCS path to a directory containing .bootstrap_env
#                        files (e.g. gs://my-project-bootstrap-envs/).
#                        Every *.bootstrap_env object in that path is processed.
#
# Optional substitutions:
#   _PRESERVE_CAS        Y = keep CA pools after teardown (default: N — delete)
#   _PRESERVE_DNS        Y = keep DNS zone after teardown (default: N — delete)
#
# NOTE: All shell variables inside args blocks must be written as $$VAR so
# that Cloud Build does not try to expand them as substitution variables.
# Only ${_SUBSTITUTION_NAME} (leading underscore) are valid Cloud Build
# substitutions; everything else must be escaped.
# =============================================================================

steps:
  - id: 'test-all-environments'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        # -----------------------------------------------------------------------
        # Resolve the GCS directory.
        # Strip any stray whitespace / newlines that the Cloud Build trigger UI
        # can inject when a substitution value is entered manually, then ensure
        # a trailing slash for gsutil ls.
        # -----------------------------------------------------------------------
        ENVS_DIR=$$(printf '%s' "${_BOOTSTRAP_ENVS_DIR}" | tr -d '[:space:]')
        [ -z "$$ENVS_DIR" ] && { echo "::error::_BOOTSTRAP_ENVS_DIR is empty"; exit 1; }
        case "$$ENVS_DIR" in
          */) ;;
          *)  ENVS_DIR="$${ENVS_DIR}/" ;;
        esac

        # -----------------------------------------------------------------------
        # List all .bootstrap_env files in the directory
        # -----------------------------------------------------------------------
        echo "Listing .bootstrap_env files in $$ENVS_DIR..."
        # Exclude the directory entry itself (ends with /) — all other
        # objects in the directory are treated as environment files.
        FILES=$$(gsutil ls "$$ENVS_DIR" 2>/dev/null \
          | grep -v '/$' \
          || true)

        if [ -z "$$FILES" ]; then
          echo "::error::No .bootstrap_env files found in $$ENVS_DIR"
          exit 1
        fi

        FILE_COUNT=$$(echo "$$FILES" | wc -l | tr -d ' ')
        echo "Found $$FILE_COUNT environment file(s):"
        echo "$$FILES"
        echo ""

        # -----------------------------------------------------------------------
        # Process each environment file sequentially.
        # A failed bootstrap is recorded and its environment is torn down anyway,
        # so a half-built platform never stays up; the loop then moves on. A failed
        # teardown stops the loop: the next environment shares the project
        # (Terraform state, BigTable instance) and would collide with the leftovers.
        # -----------------------------------------------------------------------
        CURRENT=0
        FAILED=""
        for ENV_PATH in $$FILES; do
          CURRENT=$$((CURRENT + 1))
          echo "=========================================================="
          echo "  [$$CURRENT/$$FILE_COUNT] Environment: $$ENV_PATH"
          echo "=========================================================="
          echo ""

          # Download and source the env file to obtain GCP_PROJECT_ID / GCP_REGION
          mkdir -p /tmp/envs
          gsutil cp "$$ENV_PATH" /tmp/envs/current.bootstrap_env
          # shellcheck source=/dev/null
          source /tmp/envs/current.bootstrap_env

          echo "  Project : $$GCP_PROJECT_ID"
          echo "  Region  : $$GCP_REGION"
          echo ""

          # ------------------------------------------------------------------
          # Preflight, read-only, seconds. A cycle that was killed part way
          # through leaves state behind, and the next bootstrap inherits it
          # silently: leftover hostname secrets get reused as-is, and leftover
          # Terraform state makes the next run plan to destroy what it describes.
          # Run 856c0722 lost two environments to exactly that, and the two
          # failures looked unrelated in the log.
          #
          # --strict because nobody is watching: here a reservation is never a
          # judgement call, it is a leftover.
          # ------------------------------------------------------------------
          # The preflight distinguishes three outcomes and the caller has to as
          # well: 0 ready, 2 ready with standing reservations, 1 blocked. Run 5
          # was lost to `if !` here, which reads any non-zero as a refusal and
          # skipped all four environments over reservations that are permanent
          # facts — no Cloud Build GitHub connection, which the submit path does
          # not need, and application-default credentials, which a service
          # account does not have.
          echo "  [0/2] Preflight (read-only)..."
          set +e
          ./iac/operating/nexus-preflight.sh "$$GCP_PROJECT_ID" \
              --region "$$GCP_REGION" --pki "$${PKI_STRATEGY:-remote}" --require-clean
          PREFLIGHT_RC=$$?
          set -e
          if [ "$$PREFLIGHT_RC" -eq 1 ]; then
            echo "::error::[$$CURRENT/$$FILE_COUNT] Preflight refused $$ENV_PATH — the project is not clean. Skipping this environment."
            FAILED="$$FAILED $$(basename "$$ENV_PATH"):preflight"
            continue
          fi
          echo "  [0/2] Preflight clean (exit $$PREFLIGHT_RC)."

          # Clear what earlier environments left in Secret Manager. Unattended
          # and unasked: there is nobody here to confirm, and a bootstrap that
          # finds a secret with a version reuses it instead of writing its own —
          # so a leftover TLS private key becomes the new platform's key.
          # The install skill takes the same step but asks a person first.
          echo "  [0/2] Clearing secrets from earlier environments..."
          # --ignore-build: this step runs inside the matrix build, which the
          # script would otherwise count as the project being busy.
          ./iac/bootstrapping/tools/delete-all-secrets.sh "$$GCP_PROJECT_ID" --yes --ignore-build "$BUILD_ID"
          echo ""

          # ------------------------------------------------------------------
          # Step 1 of 2: Bootstrap
          # ------------------------------------------------------------------
          echo "  [1/2] Submitting bootstrap-platform..."
          BOOTSTRAP_OK=true
          if gcloud builds submit . \
            --config=iac/cloudbuild/bootstrap-platform.yaml \
            --project="$$GCP_PROJECT_ID" \
            --region="$$GCP_REGION" \
            --timeout=7200 \
            --substitutions=^::^_BOOTSTRAP_ENV_GCS_PATH=$$ENV_PATH; then
            echo "  [1/2] Bootstrap complete."
          else
            BOOTSTRAP_OK=false
            FAILED="$$FAILED $$(basename "$$ENV_PATH"):bootstrap"
            echo "::error::[$$CURRENT/$$FILE_COUNT] Bootstrap failed for $$ENV_PATH — tearing it down anyway."
          fi
          echo ""

          # Only a healthy platform is left standing for the observation window.
          if [ "$$BOOTSTRAP_OK" = true ]; then
            sleep 3600
          fi

          # ------------------------------------------------------------------
          # Step 2 of 2: Teardown — always, also after a failed bootstrap
          # ------------------------------------------------------------------
          echo "  [2/2] Submitting teardown-platform..."
          if ! gcloud builds submit . \
            --config=iac/cloudbuild/teardown-platform.yaml \
            --project="$$GCP_PROJECT_ID" \
            --region="$$GCP_REGION" \
            --timeout=7200 \
            --substitutions=^::^_BOOTSTRAP_ENV_GCS_PATH=$$ENV_PATH::_PRESERVE_CAS=${_PRESERVE_CAS}::_PRESERVE_DNS=${_PRESERVE_DNS}; then
            echo "::error::[$$CURRENT/$$FILE_COUNT] Teardown failed for $$ENV_PATH — stopping, the next environment would collide with its leftovers."
            echo "Failed:$$FAILED $$(basename "$$ENV_PATH"):teardown"
            exit 1
          fi
          echo "  [2/2] Teardown complete."
          echo ""

          if [ "$$BOOTSTRAP_OK" = true ]; then
            echo "  ✓ [$$CURRENT/$$FILE_COUNT] $$ENV_PATH: cycle successful."
          else
            echo "  ✗ [$$CURRENT/$$FILE_COUNT] $$ENV_PATH: bootstrap failed, environment torn down."
          fi
          echo ""

          sleep 3600

        done

        echo "=========================================================="
        if [ -n "$$FAILED" ]; then
          echo "  Failed:$$FAILED"
          echo "=========================================================="
          exit 1
        fi
        echo "  All $$FILE_COUNT environment(s) processed successfully."
        echo "=========================================================="

# =============================================================================
# SUBSTITUTIONS & OPTIONS
# =============================================================================
substitutions:
  _BOOTSTRAP_ENVS_DIR: ''   # required — GCS directory containing .bootstrap_env files
  _PRESERVE_CAS: 'N'        # N = delete CA pools during teardown (full clean cycle)
  _PRESERVE_DNS: 'N'        # N = delete DNS zone during teardown (full clean cycle)

# 24 h ceiling — accommodates many sequential environments, each taking ~3 h
timeout: '86400s'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
  machineType: 'E2_HIGHCPU_8'
