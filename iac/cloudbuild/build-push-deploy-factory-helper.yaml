steps:
  # ============================================================================
  # 0. SETUP & AUTHENTICATION
  # ============================================================================
  - id: 'get-gke-credentials'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials "$$GKE_CLUSTER_NAME" \
          --region="$$GCP_REGION" \
          --project="$PROJECT_ID"

        echo "Injecting Cloud Build Access Token into Kubeconfig..."
        TOKEN=$$(gcloud auth print-access-token)

        kubectl config set-credentials build-user --token="$${TOKEN}"

        CONTEXT=$$(kubectl config current-context)
        kubectl config set-context "$${CONTEXT}" --user=build-user

        echo "Kubeconfig successfully patched for standalone usage."
    secretEnv: ['GKE_CLUSTER_NAME', 'GCP_REGION']

  - id: 'configure-ar'
    name: 'gcr.io/cloud-builders/gcloud@sha256:abcad906c9fa0dd063c4b6e570994f34024673486b17e9f4c99c720165e03ae5'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TOKEN=$$(gcloud auth print-access-token)
        AUTH=$$(printf '%s' "oauth2accesstoken:$$TOKEN" | base64 -w0)
        mkdir -p /root/.docker
        echo '{"auths":{"europe-west4-docker.pkg.dev":{"auth":"'$$AUTH'"}}}' \
          > /root/.docker/config.json
        echo "Artifact Registry auth configured (token-based, no credential helper)."
    waitFor: ['-']

  # ============================================================================
  # 1. BUILD & PUSH FACTORY HELPER (Docker Buildx)
  # ============================================================================
  - id: 'build-push-factory-helper'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Initializing Docker Buildx..."
        docker buildx create --name builder --use

        SHA="${_COMMIT_SHA}"

        if [ -z "$$SHA" ] || [ "$$SHA" == "manual" ]; then
           if [ -n "$COMMIT_SHA" ]; then
             SHA="$COMMIT_SHA"
           else
             SHA="manual-latest"
           fi
        fi

        echo "$$SHA" > commit_sha.txt

        echo "Building for Commit SHA: $$SHA (Platform: linux/${_ARCH})"

        IMAGE_URI="$${IMAGE_REPO}/factory-helper"

        TAG_SHA="$${IMAGE_URI}:$${SHA}"
        TAG_LATEST="$${IMAGE_URI}:latest"
        CACHE_TAG="$${IMAGE_URI}:buildcache"

        docker buildx build \
          --platform linux/${_ARCH} \
          --build-arg DOCKER_HUB_MIRROR="$${IMAGE_REPO%/artifact-registry}/docker-hub" \
          --file ./base-services/factory-helper/Dockerfile \
          --tag "$$TAG_SHA" \
          --tag "$$TAG_LATEST" \
          --cache-from "type=registry,ref=$$CACHE_TAG" \
          --cache-to "type=inline" \
          --push \
          .
    secretEnv: [ 'IMAGE_REPO' ]
    waitFor: ['configure-ar']

  # ============================================================================
  # 2. TLS CERT VIA GCP CAS (remote-only; local PKI is unsupported for v1)
  # ============================================================================
  - id: 'issue-factory-tls-cert'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update -q && apt-get install -y -q openssl
        if [ "$$PKI_STRATEGY" != "remote" ]; then
          echo "::error::factory-helper v1 supports PKI_STRATEGY=remote only"; exit 1
        fi

        BASE_DOMAIN=$$(gcloud secrets versions access latest --secret="BASE_DOMAIN" --project="$PROJECT_ID" | tr -d '\n')
        echo "$$BASE_DOMAIN" > domain.txt
        HOSTNAME="factory.$${BASE_DOMAIN}"
        REGION_CLEAN="$$(echo "$$GCP_REGION" | tr -d '\n')"
        CERT_ID="factory-helper-$(date +%s)"

        echo "Generating certificate for: $$HOSTNAME in region: $$REGION_CLEAN"
        mkdir -p temp-certs

        openssl genpkey -algorithm RSA -out temp-certs/server.key.pem
        openssl req -new -key temp-certs/server.key.pem \
          -out temp-certs/server.csr.pem \
          -subj "/CN=$$HOSTNAME" \
          -addext "subjectAltName=DNS:$$HOSTNAME"

        SERVER_CA_POOL=$$(gcloud secrets versions access latest --secret="SERVER_CA_POOL" --project="$PROJECT_ID" | tr -d '\n')

        echo "Requesting signature from GCP CAS using pool: $$SERVER_CA_POOL"
        if ! gcloud privateca certificates create "$$CERT_ID" \
          --issuer-pool="$$SERVER_CA_POOL" \
          --issuer-location="$$REGION_CLEAN" \
          --csr="temp-certs/server.csr.pem" \
          --cert-output-file="temp-certs/server.crt.pem" \
          --validity="P30D" \
          --quiet \
          --project="$PROJECT_ID"; then
             echo "::error::Failed to issue certificate"
             exit 1
        fi
        echo "✓ Certificate issued via GCP CAS"

        add_secret_version() {
          gcloud secrets describe "$$1" --project="$PROJECT_ID" >/dev/null 2>&1 || \
            gcloud secrets create "$$1" --replication-policy=automatic --project="$PROJECT_ID"
          gcloud secrets versions add "$$1" --data-file="$$2" --project="$PROJECT_ID"
        }
        add_secret_version "FACTORY_HELPER_TLS_CERT" "temp-certs/server.crt.pem"
        add_secret_version "FACTORY_HELPER_TLS_KEY" "temp-certs/server.key.pem"

        # Values the helmfile deploy step needs (its container has no gcloud):
        gcloud secrets versions access latest --secret="FACTORY_CA_POOL" --project="$PROJECT_ID" | tr -d '\n' > factory_ca_pool.txt
        gcloud secrets versions access latest --secret="KEYCLOAK_TLS_CRT" --project="$PROJECT_ID" > keycloak_tls_crt.txt
        echo "$$GCP_REGION" | tr -d '\n' > gcp_region.txt
    secretEnv: [ 'PKI_STRATEGY', 'GCP_REGION' ]
    waitFor: ['get-gke-credentials']

  # ============================================================================
  # 3. DEPLOY
  # ============================================================================
  - id: 'deploy-factory-helper'
    name: 'ghcr.io/helmfile/helmfile:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ ! -f "commit_sha.txt" || ! -f "domain.txt" || ! -f "factory_ca_pool.txt" || ! -f "temp-certs/server.crt.pem" ]]; then
          echo "::error::Required artifact files from earlier steps not found."
          ls -la
          exit 1
        fi
        export COMMIT_SHA=$$(cat commit_sha.txt)
        export BASE_DOMAIN=$$(cat domain.txt)
        export GCP_PROJECT_ID="$PROJECT_ID"
        export GCP_REGION=$$(cat gcp_region.txt)
        export FACTORY_CA_POOL=$$(cat factory_ca_pool.txt)
        export FACTORY_HELPER_TLS_CERT="$(cat temp-certs/server.crt.pem)"
        export FACTORY_HELPER_TLS_KEY="$(cat temp-certs/server.key.pem)"
        export KEYCLOAK_TLS_CRT="$(cat keycloak_tls_crt.txt)"

        cd iac/helm/helmfile.d
        if ! helmfile --file factory-helper.yaml.gotmpl ${_HELM_ACTION} --wait \
            --args "--timeout 4m0s" \
            --state-values-set arch=${_ARCH} \
            --state-values-set baseDomain="$$BASE_DOMAIN" \
            --state-values-set image.tag="$${COMMIT_SHA}"; then

            echo "❌ Deployment Failed! Fetching Pod Logs for Debugging..."

            if ! command -v kubectl &> /dev/null; then
                curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl
                mv kubectl /usr/local/bin/
            fi

            echo "--- POD STATUS ---"
            kubectl get pods -n factory -l app.kubernetes.io/name=factory-helper
            echo "--- LOGS ---"
            kubectl logs -n factory -l app.kubernetes.io/name=factory-helper --tail=50

            exit 1
        fi
    secretEnv: [ 'IMAGE_REPO', 'FACTORY_HELPER_CERT_VALIDITY_DAYS' ]
    waitFor: [ 'build-push-factory-helper', 'issue-factory-tls-cert' ]

# ============================================================================
# SUBSTITUTIONS & SECRETS CONFIG
# ============================================================================
substitutions:
  _ENVIRONMENT: "sandbox"
  _ARCH: "arm64"
  _CLUSTER_NAME: "sandbox-gke"
  _REGION: "europe-west4"
  _COMMIT_SHA: "manual"
  _HELM_ACTION: "sync"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/PKI_STRATEGY/versions/latest
      env: 'PKI_STRATEGY'
    - versionName: projects/$PROJECT_ID/secrets/GCP_REGION/versions/latest
      env: 'GCP_REGION'
    - versionName: projects/$PROJECT_ID/secrets/GKE_CLUSTER_NAME/versions/latest
      env: 'GKE_CLUSTER_NAME'
    - versionName: projects/$PROJECT_ID/secrets/IMAGE_REPO/versions/latest
      env: 'IMAGE_REPO'
    - versionName: projects/$PROJECT_ID/secrets/FACTORY_HELPER_CERT_VALIDITY_DAYS/versions/latest
      env: 'FACTORY_HELPER_CERT_VALIDITY_DAYS'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
