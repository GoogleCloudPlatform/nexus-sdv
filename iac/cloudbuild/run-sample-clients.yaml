# =============================================================================
# run-sample-clients.yaml — Sample client smoke-test build
#
# Runs `make all` (proto → certs → build → run) in both sample client
# directories as an end-to-end smoke test after a successful bootstrap.
#
# Each client is wrapped in `timeout 120s`. A clean timeout (exit 124) is
# treated as success — it means the client connected, registered, and published
# telemetry for the full 2-minute window without crashing.
#
# A third step then scans BigTable for a fresh telemetry row per client VIN
# (written after this build's start, not stale data from a previous run) and
# fails the build if either is missing within 90 s.
#
# Triggered automatically after a successful bootstrap via
# iac/cloudbuild/platform-health-check.yaml's _RUN_E2E=Y (itself triggered by
# bootstrap-platform.yaml — see that file's step 2), or run manually:
#
#   gcloud builds submit . \
#     --config=iac/cloudbuild/run-sample-clients.yaml \
#     --project=<PROJECT_ID> \
#     --region=<REGION> \
#     --substitutions=_BOOTSTRAP_ENV_GCS_PATH=gs://<PROJECT_ID>-bootstrap-envs/sandbox.bootstrap_env
#
# Required substitutions: _BOOTSTRAP_ENV_GCS_PATH
#
# NOTE: All shell variables inside args blocks must be written as $$VAR so
# that Cloud Build does not try to expand them as substitution variables.
# Only ${_SUBSTITUTION_NAME} (leading underscore) are valid Cloud Build
# substitutions; everything else must be escaped.
# =============================================================================

steps:
  # ===========================================================================
  # Record a start-of-build timestamp before any client runs, so
  # verify-bigtable can later confirm a row *newer than this instant* exists.
  # ===========================================================================
  - id: 'record-start-time'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    waitFor: ['-']
    args:
      - '-c'
      - |
        # Fixed-width, zero-padded UTC timestamp matching the row-key format
        # written by the nats-bigtable-connector
        # (iac/helm/nats-bigtable-connector/templates/configmap-template.yaml).
        date -u +'%Y-%m-%dT%H:%M:%S.000000000Z' > /workspace/.e2e_since
        echo "Recorded start time: $$(cat /workspace/.e2e_since)"

  # ===========================================================================
  # Python vehicle client — proto → downloadcerts → run
  # ===========================================================================
  - id: 'run-python-client'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    waitFor: ['record-start-time']
    args:
      - '-c'
      - |
        set -euo pipefail

        # -----------------------------------------------------------------------
        # Download bootstrap config so the Makefile and run script can source it
        # -----------------------------------------------------------------------
        echo "Downloading bootstrap config from ${_BOOTSTRAP_ENV_GCS_PATH}..."
        mkdir -p /workspace/iac/bootstrapping
        gcloud storage cp "${_BOOTSTRAP_ENV_GCS_PATH}" /workspace/iac/bootstrapping/.bootstrap_env
        echo "Config loaded."

        # -----------------------------------------------------------------------
        # For local PKI: download factory CA cert + key so generate-factory-cert.sh
        # can self-sign a vehicle factory certificate. These files are not in the
        # workspace — they are generated by build-push-deploy-registration and
        # stored in Secret Manager as REGISTRATION_FACTORY_CA_CERT/KEY.
        # -----------------------------------------------------------------------
        source /workspace/iac/bootstrapping/.bootstrap_env
        if [ "$$PKI_STRATEGY" = "local" ]; then
          echo "Local PKI: downloading PKI files from Secret Manager..."
          # Factory CA cert + key — needed by generate-factory-cert.sh to self-sign
          # a vehicle factory certificate for registration.
          mkdir -p /workspace/base-services/registration/pki/factory-ca
          gcloud secrets versions access latest \
            --secret="REGISTRATION_FACTORY_CA_CERT" --project="$$GCP_PROJECT_ID" \
            > /workspace/base-services/registration/pki/factory-ca/ca.crt.pem
          gcloud secrets versions access latest \
            --secret="REGISTRATION_FACTORY_CA_KEY" --project="$$GCP_PROJECT_ID" \
            > /workspace/base-services/registration/pki/factory-ca/ca.key.pem
          # Server CA cert — used by the Python SDK (car.py LOCAL_SERVER_CA_PATH) to
          # verify the registration server and Keycloak TLS certificates.
          mkdir -p /workspace/base-services/registration/pki/server-ca
          gcloud secrets versions access latest \
            --secret="SERVER_CA_CERT" --project="$$GCP_PROJECT_ID" \
            > /workspace/base-services/registration/pki/server-ca/ca.crt.pem
          echo "✓ Local PKI files ready."
        fi

        # -----------------------------------------------------------------------
        # Install make (not included in the cloud-sdk base image; needed by 'make all')
        # -----------------------------------------------------------------------
        apt-get update -q && apt-get install -y -q make jq

        # -----------------------------------------------------------------------
        # Install uv (fast Python package manager used by the client)
        # -----------------------------------------------------------------------
        echo "Installing uv..."
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        echo "uv $$(uv --version)"

        # -----------------------------------------------------------------------
        # Install Python dependencies (grpc_tools, nats-py, etc.)
        # -----------------------------------------------------------------------
        cd sample-clients/python
        uv sync
        echo "Python dependencies installed."

        # -----------------------------------------------------------------------
        # Run make all with a 2-minute time box.
        # Exit 124 = timeout expired cleanly = smoke test passed.
        # Any other non-zero exit = real failure.
        # -----------------------------------------------------------------------
        if [ "$$PKI_STRATEGY" = "remote" ]; then
          IDENTITY_PATH="factory-helper"
          echo "Remote PKI: factory identity from the factory-helper (no project access)."
          make proto
          timeout 120s ./run-python-client-factory.sh && RC=0 || RC=$$?
        else
          IDENTITY_PATH="local self-signing"
          echo "Local PKI: factory identity self-signed from the CA key."
          timeout 120s make all && RC=0 || RC=$$?
        fi
        if [ "$$RC" -eq 124 ]; then
          echo "✓ Python client smoke test passed via $$IDENTITY_PATH (ran 2 minutes without crashing)."
        elif [ "$$RC" -ne 0 ]; then
          echo "::error::Python client failed on the $$IDENTITY_PATH identity path, exit code $$RC."
          exit "$$RC"
        else
          echo "✓ Python client exited cleanly before timeout."
        fi

  # ===========================================================================
  # Go vehicle client — deps → proto → certs → build → run
  # ===========================================================================
  - id: 'run-vehicle-client'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    waitFor: ['record-start-time']
    args:
      - '-c'
      - |
        set -euo pipefail

        # -----------------------------------------------------------------------
        # Download bootstrap config (parallel steps each need their own copy)
        # -----------------------------------------------------------------------
        echo "Downloading bootstrap config from ${_BOOTSTRAP_ENV_GCS_PATH}..."
        mkdir -p /workspace/iac/bootstrapping
        gcloud storage cp "${_BOOTSTRAP_ENV_GCS_PATH}" /workspace/iac/bootstrapping/.bootstrap_env
        echo "Config loaded."

        # -----------------------------------------------------------------------
        # For local PKI: download factory CA cert + key (see run-python-client step)
        # -----------------------------------------------------------------------
        source /workspace/iac/bootstrapping/.bootstrap_env
        if [ "$$PKI_STRATEGY" = "local" ]; then
          echo "Local PKI: downloading PKI files from Secret Manager..."
          # Factory CA cert + key — needed by generate-factory-cert.sh to self-sign
          # a vehicle factory certificate for registration.
          mkdir -p /workspace/base-services/registration/pki/factory-ca
          gcloud secrets versions access latest \
            --secret="REGISTRATION_FACTORY_CA_CERT" --project="$$GCP_PROJECT_ID" \
            > /workspace/base-services/registration/pki/factory-ca/ca.crt.pem
          gcloud secrets versions access latest \
            --secret="REGISTRATION_FACTORY_CA_KEY" --project="$$GCP_PROJECT_ID" \
            > /workspace/base-services/registration/pki/factory-ca/ca.key.pem
          # Server CA cert — used by the Python SDK (car.py LOCAL_SERVER_CA_PATH) to
          # verify the registration server and Keycloak TLS certificates.
          mkdir -p /workspace/base-services/registration/pki/server-ca
          gcloud secrets versions access latest \
            --secret="SERVER_CA_CERT" --project="$$GCP_PROJECT_ID" \
            > /workspace/base-services/registration/pki/server-ca/ca.crt.pem
          echo "✓ Local PKI files ready."
        fi

        # -----------------------------------------------------------------------
        # Install Go 1.27
        # The clients' go.mod requires Go 1.25 or later (golang.org/x/crypto
        # v0.52.0); 1.24 and 1.25 are out of support, so use the current release.
        # -----------------------------------------------------------------------
        echo "Installing Go 1.27..."
        curl -fsSL "https://go.dev/dl/go1.27.1.linux-amd64.tar.gz" \
          | tar -xz -C /usr/local
        export PATH="/usr/local/go/bin:$$PATH"
        echo "go $$(go version)"

        # -----------------------------------------------------------------------
        # Install protoc and Go code-generator plugins
        # -----------------------------------------------------------------------
        echo "Installing protoc..."
        apt-get update -q && apt-get install -y -q protobuf-compiler make jq
        echo "protoc $$(protoc --version)"

        echo "Installing protoc-gen-go plugins..."
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
        export PATH="$$PATH:$$(go env GOPATH)/bin"

        # -----------------------------------------------------------------------
        # Run make all with a 2-minute time box
        # -----------------------------------------------------------------------
        cd sample-clients/vehicle-client
        if [ "$$PKI_STRATEGY" = "remote" ]; then
          IDENTITY_PATH="factory-helper"
          echo "Remote PKI: factory identity from the factory-helper (no project access)."
          make build
          timeout 120s ./run-vehicle-client-factory.sh && RC=0 || RC=$$?
        else
          IDENTITY_PATH="local self-signing"
          echo "Local PKI: factory identity self-signed from the CA key."
          timeout 120s make all && RC=0 || RC=$$?
        fi
        if [ "$$RC" -eq 124 ]; then
          echo "✓ Vehicle client smoke test passed via $$IDENTITY_PATH (ran 2 minutes without crashing)."
        elif [ "$$RC" -ne 0 ]; then
          echo "::error::Vehicle client failed on the $$IDENTITY_PATH identity path, exit code $$RC."
          exit "$$RC"
        else
          echo "✓ Vehicle client exited cleanly before timeout."
        fi

  # ===========================================================================
  # BigTable verification — confirm new telemetry rows were written
  #
  # Runs after both client smoke tests complete. Scans the telemetry table
  # for a row under each client's default VIN prefix separately — VEHICLE001
  # (Go vehicle-client, sample-clients/vehicle-client/main.go) and VEHICLE002
  # (Python client, sample-clients/python/run-python-client.sh:17) — so a
  # build only passes if both clients actually got data into BigTable, not
  # just one of them.
  #
  # Retries for up to ~90 s to allow the NATS-to-BigTable connector time
  # to flush any buffered writes. Fails the build if either VIN has no new row.
  # ===========================================================================
  - id: 'verify-bigtable'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:575.0.0'
    entrypoint: 'bash'
    waitFor: ['run-python-client', 'run-vehicle-client']
    args:
      - '-c'
      - |
        set -euo pipefail

        # -----------------------------------------------------------------------
        # Download bootstrap config for GCP_PROJECT_ID
        # -----------------------------------------------------------------------
        mkdir -p /workspace/iac/bootstrapping
        gcloud storage cp "${_BOOTSTRAP_ENV_GCS_PATH}" /workspace/iac/bootstrapping/.bootstrap_env
        source /workspace/iac/bootstrapping/.bootstrap_env

        SINCE=$$(cat /workspace/.e2e_since)
        echo "Checking for telemetry rows written at/after $$SINCE..."

        # -----------------------------------------------------------------------
        # Install cbt (BigTable CLI)
        # -----------------------------------------------------------------------
        echo "Installing cbt..."
        # The cbt package was renamed google-cloud-sdk-cbt -> google-cloud-cli-cbt.
        # Try the current name first and fall back, so this keeps working on both
        # older and newer cloud-sdk images.
        apt-get update -q
        apt-get install -y -q google-cloud-cli-cbt \
          || apt-get install -y -q google-cloud-sdk-cbt
        echo "cbt installed: $$(cbt version 2>&1 | head -1)"

        INSTANCE="bigtable-production-storage"
        TABLE="telemetry"
        VINS=("VEHICLE001:Go vehicle-client" "VEHICLE002:Python client")
        declare -A CONFIRMED
        CONFIRMED_COUNT=0

        # -----------------------------------------------------------------------
        # Wait for the NATS-to-BigTable connector to flush buffered writes.
        # The connector receives messages from NATS and writes to BigTable
        # asynchronously; a short pause avoids a false-negative on the first check.
        # -----------------------------------------------------------------------
        echo "Waiting 30s for BigTable connector to flush..."
        sleep 30

        # -----------------------------------------------------------------------
        # Retry loop: scan for a row under each VIN after the recorded start time.
        # cbt read with start= returns rows whose key is >= that value; since
        # keys are <vin>#<timestamp>, this bounds the scan to rows for this
        # VIN written after the recorded start time. count=1 stops at the
        # first (i.e. oldest qualifying) match.
        # -----------------------------------------------------------------------
        MAX_ATTEMPTS=6
        SLEEP_BETWEEN=10

        for i in $$(seq 1 $$MAX_ATTEMPTS); do
          for entry in "$${VINS[@]}"; do
            VIN="$${entry%%:*}"
            LABEL="$${entry#*:}"
            [ -n "$${CONFIRMED[$$VIN]:-}" ] && continue

            echo "Attempt $$i/$$MAX_ATTEMPTS: scanning $$TABLE for $$VIN# after $$SINCE ($$LABEL)..."
            RESULT=$$(cbt \
              -project="$$GCP_PROJECT_ID" \
              -instance="$$INSTANCE" \
              read "$$TABLE" \
              start="$$VIN#$$SINCE" \
              count=1 2>&1 || true)

            # cbt quotes row keys in some versions/platforms (e.g. `"VEHICLE002#...Z"`)
            # but not others (plain `VEHICLE002#...Z`) — strip any leading quote
            # before matching so this works regardless of the installed cbt build.
            if echo "$$RESULT" | sed 's/^"//' | grep -q "^$$VIN#"; then
              echo "✓ $$LABEL telemetry confirmed in BigTable (VIN $$VIN):"
              echo "$$RESULT"
              CONFIRMED[$$VIN]=1
              CONFIRMED_COUNT=$$((CONFIRMED_COUNT + 1))
            fi
          done

          if [ "$$CONFIRMED_COUNT" -eq "$${#VINS[@]}" ]; then
            echo "✓ All expected VINs confirmed in BigTable."
            exit 0
          fi

          echo "Not all VINs confirmed yet."
          if [ "$$i" -lt "$$MAX_ATTEMPTS" ]; then
            echo "Waiting $$SLEEP_BETWEEN seconds before next attempt..."
            sleep $$SLEEP_BETWEEN
          fi
        done

        TOTAL_WAIT=$$((30 + ($$MAX_ATTEMPTS - 1) * $$SLEEP_BETWEEN))
        echo "::error::Not all expected VINs were found in BigTable after $$TOTAL_WAIT seconds."
        for entry in "$${VINS[@]}"; do
          VIN="$${entry%%:*}"
          LABEL="$${entry#*:}"
          if [ -z "$${CONFIRMED[$$VIN]:-}" ]; then
            echo "::error::  Missing: $$LABEL (VIN $$VIN)"
          fi
        done
        echo "::error::Check that the NATS-to-BigTable connector is running and healthy."
        exit 1

# =============================================================================
# SUBSTITUTIONS & OPTIONS
# =============================================================================
substitutions:
  _BOOTSTRAP_ENV_GCS_PATH: ''   # required — GCS path to the .bootstrap_env file

timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
