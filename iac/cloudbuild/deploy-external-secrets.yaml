steps:
  # ============================================================================
  # 0. SETUP & AUTHENTICATION
  # ============================================================================
  - id: 'get-gke-credentials'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials "$$GKE_CLUSTER_NAME" \
          --region="$$GCP_REGION" \
          --project="$PROJECT_ID"

        echo "Injecting Cloud Build Access Token into Kubeconfig..."
        TOKEN=$$(gcloud auth print-access-token)

        kubectl config set-credentials build-user --token="$${TOKEN}"

        CONTEXT=$$(kubectl config current-context)
        kubectl config set-context "$${CONTEXT}" --user=build-user

        echo "Kubeconfig successfully patched for standalone usage."
    secretEnv: ['GKE_CLUSTER_NAME', 'GCP_REGION']

  # ============================================================================
  # 1. INSTALL EXTERNAL-SECRETS OPERATOR
  #
  # The operator is installed in external-secrets-system namespace.
  # IAM permissions (secretmanager.secretAccessor) and Workload Identity
  # binding for external-secrets-gsa are managed by Terraform (iam.tf).
  # ============================================================================
  - id: 'deploy-external-secrets'
    name: 'ghcr.io/helmfile/helmfile:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd iac/helm/helmfile.d
        helmfile --file external-secrets.yaml.gotmpl ${_HELM_ACTION} \
          --state-values-set arch=${_ARCH}
    waitFor: [ 'get-gke-credentials' ]

  # ============================================================================
  # 2. WAIT FOR WEBHOOK READINESS
  #
  # The external-secrets operator registers validating webhooks for
  # ExternalSecret and SecretStore resources. Downstream charts that create
  # these CRDs will fail if the webhook endpoints are not yet serving.
  # This step blocks until the webhook deployment is fully ready.
  # ============================================================================
  - id: 'wait-for-external-secrets-webhook'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Waiting for all external-secrets pods to be ready..."
        kubectl rollout status deployment/external-secrets-webhook \
          -n external-secrets-system --timeout=180s
        kubectl rollout status deployment/external-secrets-cert-controller \
          -n external-secrets-system --timeout=180s
        kubectl rollout status deployment/external-secrets \
          -n external-secrets-system --timeout=180s

        echo "Waiting for webhook endpoint to be populated (service must have active endpoints)..."
        TIMEOUT=120
        ELAPSED=0
        until kubectl get endpoints external-secrets-webhook -n external-secrets-system \
              -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null | grep -qE '^[0-9]+\.[0-9]+'; do
          if [ "$$ELAPSED" -ge "$$TIMEOUT" ]; then
            echo "❌ Timed out waiting for webhook endpoint after $${TIMEOUT}s"
            kubectl describe endpoints external-secrets-webhook -n external-secrets-system
            exit 1
          fi
          echo "  Webhook endpoint not yet ready (elapsed: $${ELAPSED}s), retrying in 5s..."
          sleep 5
          ELAPSED=$$((ELAPSED + 5))
        done

        echo "✅ All external-secrets components are ready and webhook endpoint is serving."
    waitFor: [ 'deploy-external-secrets' ]

# ============================================================================
# SUBSTITUTIONS & SECRETS CONFIG
# ============================================================================
substitutions:
  _ARCH: "arm64"
  _HELM_ACTION: "sync"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GCP_REGION/versions/latest
      env: 'GCP_REGION'
    - versionName: projects/$PROJECT_ID/secrets/GKE_CLUSTER_NAME/versions/latest
      env: 'GKE_CLUSTER_NAME'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
