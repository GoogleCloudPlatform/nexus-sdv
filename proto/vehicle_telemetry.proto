// The vehicle report of the Google SDV telemetry format: what a MetricsReport
// (metrics_report.proto) carries in report_data, as type
// com.android.sdv.telemetry.VehicleTelemetryData.
//
// One definition since 2026-10-09.
// Until then there were two with the same short name: this file with fourteen fields, sent by
// the Go sample client, and com.android.sdv.someip.VehicleTelemetryData
// (aaos_vehicle_telemetry.proto) with twenty-seven, sent by an AAOS vehicle. This is the
// larger one under this file's name; fields 1-13 were identical in both. An AAOS vehicle's
// metrics configuration declares the same type name and the fields it fills.
//
// Every scalar is `optional`, so a sender says which fields it fills and a value of zero is
// a value, not an absence — a standing vehicle reports VELOCITY 0.

syntax = "proto3";

package com.android.sdv.telemetry;

option go_package = "github.com/valtech-sdv/vehicle-client/telemetry";

message VehicleTelemetryData {
  optional float  ENGINE_POWER               = 1;
  optional float  ENGINE_RPM                 = 2;
  optional float  FUEL_CAPACITY              = 3;
  optional float  FUEL_LEVEL                 = 4;
  optional float  GPS_LATITUDE               = 5;
  optional float  GPS_LONGITUDE              = 6;
  optional bool   IGNITION_STATE             = 7;
  optional float  TIRE_PRESSURE              = 8;
  optional float  VELOCITY                   = 9;
  optional bool   LOCKED                     = 10;
  optional double acceleration_modulus_m_s2  = 11;
  optional uint64 distance_meters            = 12;
  CarlaVehicleDynamics vehicle_dynamics      = 13;
  CurrentGear gear_status                    = 14;
  optional float  max_speed                  = 15;
  optional float  speedlimit                 = 16;
  optional bool   speed_limit_displayed      = 17;
  optional bool   trunk_open                 = 18;
  optional bool   fog_lights                 = 19;
  optional bool   park_lights                = 20;
  optional bool   hibeam                     = 21;
  optional bool   lowbeam                    = 22;
  optional bool   turn_signal_left           = 23;
  optional bool   turn_signal_right          = 24;
  optional bool   carla_vehicle_ambient_light = 25;
  optional bool   carla_vehicle_ambient_fog  = 26;
  CarlaVehicleTripStatus trip_status         = 27;
}

message CarlaVehicleDynamics {
  optional double steering_angle_deg    = 1;
  optional double accelerator_pedal_pct = 2;
  optional double brake_pedal_pct       = 3;
}

// The gear as Google's display-safety sample defines it (display_safety.proto, CurrentGear),
// repeated here so this file stands alone.
message CurrentGear {
  enum Gear {
    P = 0;
    R = 1;
    N = 2;
    D = 3;
  }
  optional Gear gear = 1;
}

message CarlaVehicleTripStatus {
  optional uint64 start_timestamp_ms = 1;
  optional uint64 end_timestamp_ms   = 2;
  optional bool   is_active          = 3;
}
