spring.application.name=data-api-sampler
## Change default health endpoint
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
##Data api config
data-api.client.data-api-url=${DATA_API_URL}
data-api.client.data-api-username=
data-api.client.data-api-password=

## Who may read telemetry here (#558)
# The issuer is learned from Keycloak's discovery document, because it differs
# between remote and local PKI. Discovery and key set are fetched inside the
# cluster over plain HTTP.
nexus.auth.discovery-uri=${KEYCLOAK_DISCOVERY_URL}
nexus.auth.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
nexus.auth.required-realm-role=${REQUIRED_REALM_ROLE:factory-operator}

## This service's own credentials for calling the Data API (#558)
spring.security.oauth2.client.registration.data-api.client-id=${KEYCLOAK_CLIENT_ID:factory-operator}
spring.security.oauth2.client.registration.data-api.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.data-api.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.data-api.provider=keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI}
