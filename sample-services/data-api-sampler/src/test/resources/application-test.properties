####This is the application.properties that should be used in ITCases
spring.application.name=data-api-sampler
## Change default health endpoint
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
##Data api config
data-api.client.data-api-url=placeholder
data-api.client.data-api-username=
data-api.client.data-api-password=

## Who may read telemetry here (#558). No test reaches Keycloak: the decoder
## fetches the key set lazily and the token manager only on the first call.
nexus.auth.discovery-uri=http://keycloak.test.invalid/realms/sdv-telemetry/.well-known/openid-configuration
nexus.auth.jwk-set-uri=https://keycloak.test.invalid/realms/sdv-telemetry/protocol/openid-connect/certs
nexus.auth.required-realm-role=factory-operator

spring.security.oauth2.client.registration.data-api.client-id=factory-operator
spring.security.oauth2.client.registration.data-api.client-secret=test-secret
spring.security.oauth2.client.registration.data-api.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.data-api.provider=keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=https://keycloak.test.invalid/realms/sdv-telemetry/protocol/openid-connect/token
