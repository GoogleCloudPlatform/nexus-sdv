# Runs deploy/apply.sh from Cloud Build instead of from a developer's shell, so the
# deployment touches nobody's local kubeconfig. Submitted by hand:
#
#   gcloud builds submit --project <gcp-project> \
#     --config base-services/nexus-pubsub-consumer/deploy/cloudbuild-deploy.yaml \
#     --substitutions=_TAG=<image tag> .
#
# The image must already be in Artifact Registry — cloudbuild-build-push.yaml puts it
# there. Like that file, this one lives beside the service rather than in
# iac/cloudbuild/, and no trigger points at it (design spec §4.3).
#
# apply.sh stays the single definition of what deploying this service means; this file
# only supplies it with cluster credentials and the image tag.
# One step, deliberately: a kubeconfig written in one build step is not reliably
# visible to the next, and a kubectl whose KUBECONFIG points at a missing file falls
# back to localhost:8080 rather than failing — which is how a split version failed,
# with a connection-refused error that named neither the cluster nor the file.
steps:
  - id: 'deploy-and-show-what-arrives'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # TAG arrives as an environment variable, not spliced into this script: Cloud Build
        # substitutes a substitution variable as text before bash reads it, so a value with a quote or a
        # semicolon would become part of the script itself.
        [[ "$$TAG" =~ ^[A-Za-z0-9_.-]{1,128}$$ ]] || { echo "_TAG must be 1-128 characters of A-Z a-z 0-9 _ . -" >&2; exit 1; }
        export KUBECONFIG=/workspace/kubeconfig
        gcloud container clusters get-credentials "$$GKE_CLUSTER_NAME" \
          --region="$$GCP_REGION" --project="$PROJECT_ID"
        # Autopilot's kubeconfig wants the auth plugin; the build's own token replaces it.
        kubectl config set-credentials build-user --token="$$(gcloud auth print-access-token)"
        kubectl config set-context "$$(kubectl config current-context)" --user=build-user
        kubectl version --output=json >/dev/null   # fails here, not inside apply.sh

        export IMAGE="$${IMAGE_REPO}/nexus-pubsub-consumer:$$TAG"
        echo "deploying $${IMAGE}"
        bash base-services/nexus-pubsub-consumer/deploy/apply.sh "$PROJECT_ID"

        # The point of the whole exercise: does a message published in the vehicle
        # arrive here, decoded, field by field.
        sleep 30
        kubectl -n base-services logs --tail=40 deployment/nexus-pubsub-consumer
    env: ['TAG=${_TAG}']
    secretEnv: ['GKE_CLUSTER_NAME', 'GCP_REGION', 'IMAGE_REPO']

substitutions:
  _TAG: "manual"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GCP_REGION/versions/latest
      env: 'GCP_REGION'
    - versionName: projects/$PROJECT_ID/secrets/GKE_CLUSTER_NAME/versions/latest
      env: 'GKE_CLUSTER_NAME'
    - versionName: projects/$PROJECT_ID/secrets/IMAGE_REPO/versions/latest
      env: 'IMAGE_REPO'

timeout: '900s'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
